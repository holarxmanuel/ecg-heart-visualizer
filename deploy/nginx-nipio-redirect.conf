# ecg.192-99-245-44.nip.io -- superseded by https://ecgv.stream
#
# Kept as a redirect rather than deleted. The hostname was handed out and is
# in at least one installed copy, and a dead name is worse than a forwarding
# one. The certificate is still renewed by acme.sh, which is why the ACME
# location below stays: without it the redirect itself would stop working over
# https in 90 days.
#
# NOTE for anyone who installed the app from this hostname: a PWA's identity is
# its origin, so that install cannot be migrated by a redirect. It has to be
# reinstalled from ecgv.stream. This forwards them to the right place; it
# cannot move their installation for them.

server {
    listen 80;
    listen [::]:80;
    server_name ecg.192-99-245-44.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://ecgv.stream$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ecg.192-99-245-44.nip.io;

    ssl_certificate     /etc/ssl/ecg/fullchain.pem;
    ssl_certificate_key /etc/ssl/ecg/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ecgv.stream$request_uri;
}
