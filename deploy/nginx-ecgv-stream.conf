# ECG Heart Visualizer -- https://ecgv.stream
#
# Same shape as zz-ecg (the nip.io host it replaces), and the same reasons
# apply, so read that file's comments alongside this one. Filename still sorts
# after `obertransit`, which must stay the implicit default_server on :443.
#
# Canonical origin is the APEX, ecgv.stream. www redirects to it. That is not
# cosmetic: an installed PWA's identity IS its origin, so serving the app on
# two hostnames would create two apps with two separate caches, and whichever
# one a user happened to install from would be the only one their data lived
# in.

# ---- ACME + plain HTTP ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ecgv.stream www.ecgv.stream;

    # Declaring server_name here takes these hosts out of the port-80
    # catch-all that would otherwise answer renewals, so serve them here.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://ecgv.stream$request_uri;
    }
}

# ---- www -> apex, over TLS ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ecgv.stream;

    ssl_certificate     /etc/ssl/ecgv/fullchain.pem;
    ssl_certificate_key /etc/ssl/ecgv/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ecgv.stream$request_uri;
}

# ---- the app -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ecgv.stream;

    ssl_certificate     /etc/ssl/ecgv/fullchain.pem;
    ssl_certificate_key /etc/ssl/ecgv/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 16M;

    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # A pinned service worker is the one PWA failure that cannot be fixed
    # remotely, so neither it nor the version probe may ever be cached.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /version.json {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Content-addressed names, so a cached copy can never be stale.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Stable names, replaced contents: revalidate rather than pin.
    location /slides/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The live trace. Buffering off, or the stream arrives in bursts and the
    # app's own latency meter reports it as lag.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # index.html is the only file here that is not content-hashed, and
    # `vite build` empties dist/, so a stale copy names assets that are gone
    # and the page renders partly. Revalidate every load.
    location / {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
        proxy_read_timeout 300s;
    }
}
