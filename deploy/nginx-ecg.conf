# ECG Heart Visualizer -- https://ecg.192-99-245-44.nip.io
#
# A name-based virtual host, entirely separate from OBer. It adds hostnames,
# it does not change any existing block. The filename sorts last on purpose:
# sites-enabled/* is included in glob order, and the FIRST block on a port is
# nginx's implicit default_server for it, so loading after `obertransit`
# leaves obertransit.com the default for :443 exactly as before.
#
# Backend: FastAPI on 127.0.0.1:8000 (systemd ecg-backend).

server {
    listen 80;
    listen [::]:80;
    server_name ecg.192-99-245-44.nip.io;

    # Keep issuing renewals from this host, since declaring server_name here
    # takes it out of the port-80 catch-all that would otherwise serve them.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ecg.192-99-245-44.nip.io;

    ssl_certificate     /etc/ssl/ecg/fullchain.pem;
    ssl_certificate_key /etc/ssl/ecg/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 16M;

    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;

    # Proxy headers are set once here and inherited. NOTE: a location that
    # declares any proxy_set_header of its own overrides ALL of these, which is
    # why /ws/ repeats them in full.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The backend decides "is this origin secure" from this header, which is
    # what unlocks Web Serial and the install prompt in the UI.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # ---- caching -------------------------------------------------------
    # Ported from the original deploy/Caddyfile. These were lost in the move
    # from Caddy to nginx, and their absence is not cosmetic: with no
    # Cache-Control at all, a browser applies heuristic freshness and can serve
    # a stale index.html or pin itself to an old service worker.

    # The service worker and the version probe must never come from a cache.
    # A pinned worker is the one PWA failure that cannot be fixed remotely:
    # the client keeps serving an old build and never learns a new one exists.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /version.json {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed filenames are content-addressed, so a cached copy can never be
    # stale and it is safe to pin them for a year.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The deck keeps stable filenames while its contents are replaced, so it
    # must be revalidated rather than pinned.
    location /slides/ {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The live trace. WebSockets need the upgrade headers explicitly, and must
    # not be buffered -- buffering would batch the stream into bursts and the
    # latency meter would read them as lag.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # The client pings every ~3 s, so this only matters if that stops.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else, index.html included. index.html is the ONLY file the
    # app ships that is not content-hashed, and `vite build` empties dist/, so
    # the assets an old index.html names are gone from the server. A browser
    # holding a stale index therefore renders a page whose scripts 404: it
    # "loads partly". no-cache forces revalidation on every load, which costs
    # one conditional request and removes that entire failure mode.
    location / {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Content-Type-Options nosniff always;
        proxy_read_timeout 300s;
    }
}
